
name: GitHub Issue Triager

on:
  workflow_dispatch:
    inputs:
      issue_url:
        description: "Full GitHub issue URL"
        required: true
        type: string
      apply_labels:
        description: "Apply AI-suggested labels"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run AI triager
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.apply_labels }}" = "true" ]; then
            python agent.py --issue-url "${{ inputs.issue_url }}" --apply-labels
          else
            python agent.py --issue-url "${{ inputs.issue_url }}"
          fi
